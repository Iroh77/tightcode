# TightCode CI — wraps the local gate (scripts/verify.sh), toolchain 100% upstream.
# Deliberate divergence from upstream workflows, see docs/divergence.md.
#
# Test scope follows the fork's divergence surface (decision 2026-09-05):
# the gate (lint + typecheck) always runs; the targeted test suite runs only
# when the diff touches packages/core or packages/opencode (code or merges).
# Other commits (docs/CI/etc.) skip tests → fast, green, informative.
#   PR scope:      diff vs base branch (merge-base)
#   push scope:    last commit only (HEAD^..HEAD) — multi-commit pushes may
#                  under-scope; accepted for the solo push-to-dev flow.
#
# Test-file exclusions (known-flaky upstream / environment-dependent, unrelated
# to our divergences — decision 2026-09-05):
#   packages/core/test/models.test.ts            → ModelsDev: requires live HTTP
#   packages/core/test/project-copy.test.ts      → ProjectCopy: requires git worktree
#   packages/opencode/test/tool/write.test.ts    → sensitive-file permissions
#   packages/opencode/test/server/project-copy.test.ts → git worktree copies
#   packages/opencode/test/cli/help/help-snapshots.test.ts → help-text snapshots (env)
#   packages/opencode/test/cli/run/run-process.test.ts → subprocess 15s timeout, flaky on 2-core runners
# Fork rule: NEVER edit an upstream test. ANY other test failure = red.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gate (lint + typecheck + targeted tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Local gate (scripts/verify.sh)
        run: ./scripts/verify.sh
      - name: Check test scope
        id: scope
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
            CHANGED="$(git diff --name-only "$BASE"...HEAD 2>/dev/null || true)"
          else
            CHANGED="$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)"
          fi
          if echo "$CHANGED" | grep -qE "^packages/(core|opencode)/"; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi
          echo "changed:"; echo "$CHANGED" | head -20
      - name: Targeted tests
        if: steps.scope.outputs.run-tests == 'true'
        run: |
          bun test --cwd packages/core --path-ignore-patterns="**/models.test.ts" --path-ignore-patterns="**/project-copy.test.ts"
          bun test --cwd packages/opencode --path-ignore-patterns="**/tool/write.test.ts" --path-ignore-patterns="**/server/project-copy.test.ts" --path-ignore-patterns="**/cli/help/help-snapshots.test.ts" --path-ignore-patterns="**/cli/run/run-process.test.ts"
