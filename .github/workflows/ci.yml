name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Gate (lint + typecheck + tests ciblés)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Gate locale (scripts/verify.sh)
        run: ./scripts/verify.sh
      - name: Tests ciblés
        run: |
          bun test --cwd packages/core
          bun test --cwd packages/opencode
